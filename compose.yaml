name: eip

services:

  ollama:
    image: ollama/ollama@sha256:1cabd20e1762a7a8444bf4a7110b346d923cd77ab6c97c984434140638c913ec

    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NO_CLOUD: "true"

    volumes:
      - ollama-models:/root/.ollama

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

    restart: unless-stopped

  ollama-init:
    image: ollama/ollama@sha256:1cabd20e1762a7a8444bf4a7110b346d923cd77ab6c97c984434140638c913ec

    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}

    depends_on:
      ollama:
        condition: service_healthy

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        if ollama show "$${OLLAMA_MODEL}" >/dev/null 2>&1; then
          echo "Configured model already available."
        else
          ollama pull "$${OLLAMA_MODEL}"
        fi

    restart: "no"

  demo-init:
    image: eip-backend:local

    build:
      context: .
      dockerfile: deployment/backend.Dockerfile

    environment:
      DATABASE_PATH: /app/data/eip_demo.db

    volumes:
      - demo-data:/app/data

    command:
      - python
      - -m
      - backend.pipelines.demo_bootstrap

    restart: "no"

  backend:
    image: eip-backend:local

    build:
      context: .
      dockerfile: deployment/backend.Dockerfile

    environment:
      APP_ENV: demo
      LOG_LEVEL: INFO
      DATABASE_PATH: /app/data/eip_demo.db
      GITHUB_REPOSITORY: apache/airflow
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}

    depends_on:
      demo-init:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully

    volumes:
      - demo-data:/app/data

    ports:
      - "127.0.0.1:8001:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: deployment/frontend.Dockerfile

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "127.0.0.1:8080:80"

volumes:
  ollama-models:
  demo-data:
