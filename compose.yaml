name: eip

services:
  backend:
    build:
      context: .
      dockerfile: deployment/backend.Dockerfile

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434

    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./data
        target: /app/data

    ports:
      - "127.0.0.1:8001:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: deployment/frontend.Dockerfile

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "127.0.0.1:8080:80"
