name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Quality and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" build

      - name: Lint backend
        run: ruff check backend

      - name: Verify backend formatting
        run: ruff format --check backend

      - name: Execute backend tests
        run: python -m pytest -q --tb=short

      - name: Build Python distribution
        run: python -m build

      - name: Validate packaged SQL resources
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))

          assert len(wheels) == 1, (
              f"Expected one wheel, found {len(wheels)}"
          )

          source_sql = {
              path.as_posix()
              for path in Path(
                  "backend/data_engineering/sql"
              ).rglob("*.sql")
          }

          assert source_sql, "No source SQL resources found"

          with ZipFile(wheels[0]) as wheel:
              packaged_sql = {
                  name
                  for name in wheel.namelist()
                  if name.startswith(
                      "backend/data_engineering/sql/"
                  )
                  and name.endswith(".sql")
              }

          missing = source_sql - packaged_sql
          unexpected = packaged_sql - source_sql

          assert not missing, f"Missing SQL resources: {missing}"
          assert not unexpected, (
              f"Unexpected SQL resources: {unexpected}"
          )

          print(
              f"Validated {len(packaged_sql)} packaged SQL resources."
          )
          PY

  frontend:
    name: Frontend Quality and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Compile and build frontend
        run: npm run build
